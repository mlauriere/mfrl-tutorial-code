experiment: smoke_cyber_qlearning
seed: 1
device: cpu
output_root: outputs/smoke
common_noise:
  enabled: false
model:
  T: 0.2
  dt: 0.1
  dt_fine: 0.1
  n_steps_state: 4
  n_actions_level: 2
  discount_ref: 0.5
  dt_ref: 0.1
  simplex_slices: [0.0, 0.25, 0.5, 0.75, 1.0]
  simplex_grid_res: 10
solvers:
  - name: SyncFull
    mode: sync_complete
    total_iters: 1
    lr_start: 0.9
    lr_end: 0.9
    epsilon: 0.0
    epsilon_end: 0.0
    epsilon_decay: 1.0
    eval_freq: 1
    plot_freq: 1
  - name: SyncGreedy
    mode: sync_greedy
    total_iters: 1
    lr_start: 0.8
    lr_end: 0.1
    epsilon: 0.5
    epsilon_end: 0.05
    epsilon_decay: 0.9997
    eval_freq: 1
    plot_freq: 1
  - name: AsyncTraj
    mode: async_trajectory
    total_iters: 1
    lr_start: 0.5
    lr_end: 0.05
    epsilon: 0.5
    epsilon_end: 0.01
    epsilon_decay: 0.9997
    eval_freq: 1
    plot_freq: 1
