experiment: cyber_qlearning_with_cn
seed: 1
device: cpu
output_root: outputs
common_noise:
  enabled: true
  sigma: 0.05
  clip_low_multiplier: 0.7
  clip_high_multiplier: 1.3
model:
  T: 10.0
  dt: 0.2
  dt_fine: 0.1
  n_steps_state: 30
  n_actions_level: 2
  discount_ref: 0.5
  dt_ref: 0.1
  simplex_slices: [0.0, 0.25, 0.5, 0.75, 1.0]
  simplex_grid_res: 10
solvers:
  - name: SyncFull
    mode: sync_complete
    total_iters: 5000
    lr_start: 0.9
    lr_end: 0.9
    epsilon: 0.0
    epsilon_end: 0.0
    epsilon_decay: 1.0
    eval_freq: 1000
    plot_freq: 1000
  - name: SyncGreedy
    mode: sync_greedy
    total_iters: 5000
    lr_start: 0.8
    lr_end: 0.1
    epsilon: 0.5
    epsilon_end: 0.05
    epsilon_decay: 0.9997
    eval_freq: 1000
    plot_freq: 1000
  - name: AsyncTraj
    mode: async_trajectory
    total_iters: 400000
    lr_start: 0.5
    lr_end: 0.05
    epsilon: 0.5
    epsilon_end: 0.01
    epsilon_decay: 0.9997
    eval_freq: 2000
    plot_freq: 5000
